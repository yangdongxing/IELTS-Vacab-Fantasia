name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-pages.yml
      - assets/**
      - build_site.py
      - content/**
      - data/spoken-usage.jsonl
      - dist/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build static site
        run: python3 build_site.py build

      - name: Check Pages artifact size
        shell: bash
        run: |
          size_bytes=$(du --bytes --summarize --dereference dist | cut -f1)
          echo "Pages artifact source: ${size_bytes} bytes"
          if (( size_bytes >= 1000000000 )); then
            echo "dist exceeds the supported 1 GB GitHub Pages size." >&2
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
