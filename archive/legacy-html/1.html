      m3_s9: {

      m3_s10: {

      },
      m3_s11: {

        english: "By continuously subsidizing agricultural production and optimizing mass transit networks for food delivery, authorities can solve problems rather than being destroyed by unpredictable market fluctuations."
      },
      m3_s12: {

      },
      m3_s13: {

      },
      m3_s14: {

        english: "Maintaining this approach is an effective strategy for survival and success, which ultimately ensures comprehensive well-being."
      },
      m3_s15: {
        chinese: "总而言之，【全球粮食分配】中的严重问题是由【不受监管的市场商业化】和【持续的地区冲突】引起的。",
        english: "In conclusion, the severe problem in global food distribution is caused by unregulated market commercialization and persistent regional conflicts."
      },
      m3_s16: {
        chinese: "然而，通过【补贴农业物流】和【加强国际人道主义合作】，【人类社会】【可以成功适应这个挑战并保护他们的未来】。",
        english: "However, through subsidizing agricultural logistics and enhancing international humanitarian cooperation, human society can successfully adapt to this fast-paced challenge and protect their future."
      }
    };

    const SentenceTrainer = ({ sentenceData, onComplete, totalSentences, currentSentenceIndex, onNavigate }) => {
      // Map to keep track of user input answers for all `input` parts
      const inputIndices = sentenceData.parts
        .map((p, i) => p.type === 'input' ? i : -1)
        .filter(i => i !== -1);
      
      const [values, setValues] = useState({});
      const [statuses, setStatuses] = useState({}); // 'correct', 'error', 'none'
      const [showHints, setShowHints] = useState({}); // { index: boolean }
      const [exampleValue, setExampleValue] = useState('');
      const [exampleStatus, setExampleStatus] = useState('none');
      const [showExampleHint, setShowExampleHint] = useState(false);
      const [isChecked, setIsChecked] = useState(false);
      const [allCorrect, setAllCorrect] = useState(false);
      const [shake, setShake] = useState(false);
      
      const inputRefs = useRef({});
      const exampleRef = useRef(null);

      // Reset state when sentence changes
      useEffect(() => {
        setValues({});
        setStatuses({});
        setShowHints({});
        setExampleValue('');
        setExampleStatus('none');
        setShowExampleHint(false);
        setIsChecked(false);
        setAllCorrect(false);
        setShake(false);
        // auto focus the example first when it exists; otherwise fall back to the first skeleton input
        if (sentenceData.example && exampleRef.current) {
          exampleRef.current.focus();
        } else if (inputIndices.length > 0 && inputRefs.current[inputIndices[0]]) {
          inputRefs.current[inputIndices[0]].focus();
        }
      }, [sentenceData.id]);

      // ESC 快捷键：显示/隐藏当前聚焦输入框的提示
      useEffect(() => {
        const handleEsc = (e) => {
          if (e.key === 'Escape') {
            if (sentenceData.example && exampleRef.current === document.activeElement) {
              setShowExampleHint(prev => !prev);
              return;
            }

            const focusedIdx = inputIndices.find(idx => inputRefs.current[idx] === document.activeElement);
            if (focusedIdx !== undefined) {
              setShowHints(prev => ({ ...prev, [focusedIdx]: !prev[focusedIdx] }));
            }
          }
        };
        document.addEventListener('keydown', handleEsc);
        return () => document.removeEventListener('keydown', handleEsc);
      }, [statuses, inputIndices]);

      const handleChange = (e, index) => {
        const newValue = e.target.value;
        const cleanedValue = cleanText(newValue);
        const cleanedAnswer = cleanText(sentenceData.parts[index].answer);
        let nextStatus = 'none';

        if (cleanedValue) {
          nextStatus = cleanedValue === cleanedAnswer
            ? 'correct'
            : cleanedAnswer.startsWith(cleanedValue)
              ? 'none'
              : 'error';
        }

        setValues({ ...values, [index]: newValue });
        setStatuses({ ...statuses, [index]: nextStatus });
      };

      const getLiveStatus = (value, answer) => {
        const cleanedValue = cleanText(value);
        const cleanedAnswer = cleanText(answer);

        if (!cleanedValue) return 'none';
        if (cleanedValue === cleanedAnswer) return 'correct';
        return cleanedAnswer.startsWith(cleanedValue) ? 'none' : 'error';
      };

      const handleExampleChange = (e) => {
        const newValue = e.target.value;
        setExampleValue(newValue);

        if (sentenceData.example) {
          setExampleStatus(getLiveStatus(newValue, sentenceData.example.english));
        }
      };

      const handleKeyDown = (e, index) => {
        if (e.key === 'Enter') {
          handleCheck();
        }
      };

      const handleCheck = () => {
        let isPerfect = true;
        const newStatuses = {};
        
        inputIndices.forEach(idx => {
          const userVal = values[idx] || '';
          const correctAns = sentenceData.parts[idx].answer;
          
          if (cleanText(userVal) === cleanText(correctAns)) {
            newStatuses[idx] = 'correct';
          } else {
            newStatuses[idx] = 'error';
            isPerfect = false;
          }
        });
        
        setStatuses(newStatuses);
        setIsChecked(true);
        
        if (sentenceData.example) {
          const isExamplePerfect = cleanText(exampleValue) === cleanText(sentenceData.example.english);
          setExampleStatus(isExamplePerfect ? 'correct' : 'error');
          isPerfect = isPerfect && isExamplePerfect;
        }
        
        if (isPerfect) {
          setAllCorrect(true);
          // Auto move to next after briefly showing success
          setTimeout(() => {
            if (onComplete) onComplete();
          }, 1000);
        } else {
          setShake(true);
          setTimeout(() => setShake(false), 500);
        }
      };

      const toggleHint = (index) => {
        setShowHints(prev => ({ ...prev, [index]: !prev[index] }));
      };

      const speakExample = () => {
        if (!sentenceData.example || !('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(sentenceData.example.english);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      };

      return (
        <div className={`bg-white rounded-2xl shadow-sm border border-gray-100 p-8 w-full max-w-4xl mx-auto ${shake ? 'animate-shake' : ''}`}>
          <h2 className="text-xl font-bold text-gray-800 mb-6 flex items-center gap-2">
            <span className="text-blue-500">📝</span> 翻译与默写
          </h2>

          <div className="mb-6 flex flex-wrap items-center gap-2">
            {Array.from({ length: totalSentences }, (_, idx) => (
              <button
                key={idx}
                onClick={() => onNavigate(idx)}
                className={`w-9 h-9 rounded-lg text-sm font-bold transition-all ${
                  idx === currentSentenceIndex
                    ? 'bg-blue-600 text-white shadow-md shadow-blue-200'
                    : idx < currentSentenceIndex
                      ? 'bg-green-50 text-green-700 border border-green-100 hover:bg-green-100'
                      : 'bg-gray-50 text-gray-500 border border-gray-200 hover:bg-gray-100 hover:text-gray-700'
                }`}
              >
                {idx + 1}
              </button>
            ))}
          </div>

          {sentenceData.example && (
            <div className="mb-10 border-b border-gray-100 pb-8">
              <div className="flex items-center justify-between gap-4 mb-4">
                <h3 className="text-lg font-bold text-gray-800 flex items-center gap-2">
                  <span className="text-emerald-500">📌</span> 对应例句
                  <button
                    type="button"
                    onClick={speakExample}
                    className="w-8 h-8 rounded-lg border border-emerald-200 bg-white text-emerald-600 text-sm font-black hover:bg-emerald-50 hover:border-emerald-300 transition-colors"
                    title="朗读英文例句"
                    aria-label="朗读英文例句"
                  >
                    ▶
                  </button>
                </h3>
                <span className={`text-xs font-bold px-3 py-1 rounded-full ${
                  exampleStatus === 'correct'
                    ? 'bg-green-100 text-green-700'
                    : exampleStatus === 'error'
                      ? 'bg-red-100 text-red-700'
                      : 'bg-gray-100 text-gray-500'
                }`}>
                  {exampleStatus === 'correct' ? '例句正确' : exampleStatus === 'error' ? '需要修正' : '等待输入'}
                </span>
              </div>

              <div className="text-base text-gray-700 font-medium mb-4 p-4 bg-emerald-50 rounded-xl border border-emerald-100 leading-relaxed">
                {sentenceData.example.chinese.split(/(【.*?】)/).map((segment, i) => {
                  if (segment.startsWith('【') && segment.endsWith('】')) {
                    return <span key={i} className="text-emerald-700 font-bold">{segment}</span>;
                  }
                  return segment;
                })}
              </div>

              <textarea
                ref={exampleRef}
                value={exampleValue}
                onChange={handleExampleChange}
                placeholder="请输入完整英文例句"
                spellCheck="false"
                className={`w-full min-h-[120px] resize-y rounded-xl border-2 p-4 text-base leading-relaxed outline-none transition-all font-mono ${
                  exampleStatus === 'correct'
                    ? 'border-green-400 bg-green-50 text-green-700'
                    : exampleStatus === 'error'
                      ? 'border-red-400 bg-red-50 text-red-700'
                      : 'border-gray-200 bg-gray-50 focus:bg-white focus:border-blue-400 focus:shadow-[0_0_0_3px_rgba(59,130,246,0.1)]'
                }`}
              />
              {showExampleHint && (
                <div className="mt-3 bg-gray-800 text-white text-sm px-4 py-3 rounded-lg shadow-lg border border-gray-700 whitespace-pre-wrap leading-relaxed">
                  {sentenceData.example.english}
                </div>
              )}
            </div>
          )}
          
          <div className="text-lg text-gray-700 font-medium mb-8 p-4 bg-gray-50 rounded-xl border border-gray-100">
            {sentenceData.chinese}
          </div>

          <div className="flex flex-wrap items-center gap-y-4 gap-x-2 text-lg font-mono">
            {sentenceData.parts.map((part, index) => {
              if (part.type === 'placeholder') {
                return (
                  <span key={index} className="px-3 py-1.5 bg-blue-500 text-white rounded-md text-sm font-sans tracking-wide shadow-sm self-baseline mt-1">
                    {part.text}
                  </span>
                );
              }
              
              if (part.type === 'text') {
                return (
                  <span key={index} className="px-1 py-1.5 text-gray-800 font-sans self-baseline mt-1">
                    {part.text}
                  </span>
                );
              }

              // Input block
              const status = statuses[index] || 'none';
              let inputClass = "px-3 py-1.5 bg-gray-50 border-2 rounded-lg outline-none transition-all focus:bg-white ";
              
              if (status === 'correct') {
                inputClass += "border-green-400 bg-green-50 text-green-700 font-semibold";
              } else if (status === 'error') {
                inputClass += "border-red-400 bg-red-50 text-red-700";
              } else {
                inputClass += "border-gray-200 focus:border-blue-400 focus:shadow-[0_0_0_3px_rgba(59,130,246,0.1)]";
              }

              // Intelligently size the input based on the truth answer length and current input
              const currentInputLength = (values[index] || '').length;
              const targetLength = Math.max(part.answer.length, currentInputLength, 3);
              const estimatedWidth = `calc(${targetLength}ch + 2rem)`;

              return (
                <div key={index} className="flex flex-col relative group">
                  <div className="flex items-center gap-1 relative">
                    <input
                      ref={el => inputRefs.current[index] = el}
                      type="text"
                      style={{ width: estimatedWidth }}
                      className={inputClass}
                      value={values[index] || ''}
                      onChange={(e) => handleChange(e, index)}
                      onKeyDown={(e) => handleKeyDown(e, index)}
                      onBlur={() => showHints[index] && setShowHints(prev => ({ ...prev, [index]: false }))}
                      spellCheck="false"
                      autoComplete="off"
                      readOnly={status === 'correct'}
                    />
                    {status === 'correct' && (
                      <span className="absolute right-2 top-1/2 -translate-y-1/2 text-green-500 font-bold">✓</span>
                    )}
                  </div>
                  
                  {(status === 'error' || showHints[index]) && (
                    <div className="absolute top-full left-0 mt-2 z-10 w-max">
                      {showHints[index] ? (
                        <div className="bg-gray-800 text-white text-sm px-4 py-2 rounded-lg shadow-lg border border-gray-700 animate-fade-in whitespace-pre-wrap max-w-sm">
                          {part.answer}
                        </div>
                      ) : (
                        <button 
                          onClick={() => toggleHint(index)}
                          className="text-xs text-red-500 hover:text-red-600 bg-red-50 px-2 py-1 rounded cursor-pointer font-sans transition-colors"
                        >
                          Show Hint 💡
                        </button>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          <div className="mt-12 flex justify-between items-center border-t border-gray-100 pt-6">
            <div className="text-gray-400 text-sm">
              ✨ 提示：可以忽略大小写和标点符号。使用 <kbd className="bg-gray-100 px-1 border rounded">Tab</kbd> 键切换输入框，<kbd className="bg-gray-100 px-1 border rounded">Enter</kbd> 键快速校验，<kbd className="bg-gray-100 px-1 border rounded">ESC</kbd> 键显示/隐藏提示。
            </div>
            <button 
              onClick={handleCheck}
              className={`px-8 py-3 rounded-xl font-bold text-white shadow-md transition-all active:scale-95 ${
                allCorrect ? 'bg-green-500 hover:bg-green-600' : 'bg-blue-600 hover:bg-blue-700 hover:shadow-lg'
              }`}
            >
              {allCorrect ? 'Perfect! 继续 ➔' : '校验 (Check)'}
            </button>
          </div>
        </div>
      );
    };

    const App = () => {
      const [activeModule, setActiveModule] = useState(TRAINING_MODULES[0].id);
      const [activeSubtype, setActiveSubtype] = useState(null);
      const [currentSentenceIndex, setCurrentSentenceIndex] = useState(0);

      // Get current view data
      const module = TRAINING_MODULES.find(m => m.id === activeModule);
      const subtype = module.subtypes.find(s => s.id === activeSubtype);
      const sentences = subtype ? subtype.sentences : module.sentences;
      const baseSentence = sentences[currentSentenceIndex];
      const sentence = baseSentence
        ? { ...baseSentence, example: REPORT_EXAMPLES[baseSentence.id] }
        : null;

      const handleModuleChange = (modId) => {
        const mod = TRAINING_MODULES.find(m => m.id === modId);
        setActiveModule(modId);
        if (mod.subtypes && mod.subtypes.length > 0) {
          setActiveSubtype(mod.subtypes[0].id);
        } else {
          setActiveSubtype(null);
        }
        setCurrentSentenceIndex(0);
      };

      const handleSubtypeChange = (subId) => {
        setActiveSubtype(subId);
        setCurrentSentenceIndex(0);
      };

      const handleComplete = () => {
        if (currentSentenceIndex < sentences.length - 1) {
          setCurrentSentenceIndex(prev => prev + 1);
        } else {
          // Module Completed
          alert("🎉 恭喜！这一节的所有句式骨架已经完成练习。");
        }
      };

      const getParagraphTitle = (id) => {
        const idMap = {
          m1_ad_s1: "Paragraph 1: 引入段", m1_ad_s4: "Paragraph 2: 主体段 1 (单点说痛点)", m1_ad_s7: "Paragraph 3: 主体段 2 (双维反驳)", m1_ad_s13: "Paragraph 4: 结尾段 (万能归纳)",
          m1_pn_s1: "Paragraph 1: 引入段", m1_pn_s3: "Paragraph 2: 主体段 1 (单点说痛点)", m1_pn_s7: "Paragraph 3: 主体段 2 (双维推销)", m1_pn_s12: "Paragraph 4: 结尾段 (万能归纳)",
          m2_s1: "Paragraph 1: 引入段 (绝杀预告)", m2_s3: "Paragraph 2: 主体段 1 (探讨观点 A)", m2_s8: "Paragraph 3: 主体段 2 (探讨观点 B)", m2_s13: "Paragraph 4: 结尾段 (寻求微妙平衡)",
          m3_s1: "Paragraph 1: 引入段", m3_s3: "Paragraph 2: 主体段 1 (Causes 原因段)", m3_s9: "Paragraph 3: 主体段 2 (Solutions 建议段)", m3_s15: "Paragraph 4: 结尾段 (动名词极简总结)",
        };
        return idMap[id];
      };

      return (
        <div className="flex h-screen overflow-hidden bg-gray-50">
          
          {/* Sidebar */}
          <div className="w-72 bg-white border-r border-gray-200 flex flex-col shadow-sm">
            <div className="p-6 border-b border-gray-100">
              <h1 className="text-2xl font-black bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">
                IELTS Trainer
              </h1>
              <p className="text-xs text-gray-500 font-medium mt-1 uppercase tracking-wider">Framework Typing App</p>
            </div>
            
            <div className="p-4 flex-1 overflow-y-auto space-y-2">
              <div className="text-xs font-bold text-gray-400 mb-3 ml-2 tracking-wide">作文骨架</div>
              {TRAINING_MODULES.map(m => (
                <button
                  key={m.id}
                  onClick={() => handleModuleChange(m.id)}
                  className={`w-full text-left px-4 py-3 rounded-xl transition-all font-medium ${
                    activeModule === m.id 
                      ? 'bg-blue-50 text-blue-700 shadow-sm border border-blue-100' 
                      : 'text-gray-600 hover:bg-gray-50 hover:text-gray-900 border border-transparent'
                  }`}
                >
                  {m.title}
                </button>
              ))}
            </div>
          </div>

          {/* Main Content */}
          <div className="flex-1 flex flex-col overflow-hidden relative">
            {/* Header & Progress */}
            <div className="bg-white border-b border-gray-200 px-8 py-6 shadow-sm z-10 flex flex-col gap-6">
              
              <div className="flex justify-between items-center">
                <h2 className="text-xl font-bold text-gray-800">{module.title}</h2>
                <div className="flex items-center gap-3">
                  <span className="text-sm font-semibold text-gray-500 bg-gray-100 px-3 py-1 rounded-full">
                    完成 {currentSentenceIndex + 1} / {sentences.length || 0}
                  </span>
                </div>
              </div>

              {/* Subtype Toggle (Tabs) */}
              {module.subtypes && module.subtypes.length > 0 && (
                <div className="flex p-1 bg-gray-100 rounded-lg w-max shadow-inner">
                  {module.subtypes.map(sub => (
                    <button
                      key={sub.id}
                      onClick={() => handleSubtypeChange(sub.id)}
                      className={`px-6 py-2 rounded-md text-sm font-semibold transition-all ${
                        activeSubtype === sub.id
                          ? 'bg-white text-gray-800 shadow-sm'
                          : 'text-gray-500 hover:text-gray-700'
                      }`}
                    >
                      {sub.name}
                    </button>
                  ))}
                </div>
              )}

              {/* Progress Bar */}
              <div className="w-full bg-gray-100 rounded-full h-2 overflow-hidden">
                <div 
                  className="bg-blue-500 h-2 rounded-full transition-all duration-500 ease-out" 
                  style={{ width: `${sentences.length ? ((currentSentenceIndex) / sentences.length) * 100 : 0}%` }}
                ></div>
              </div>
            </div>

            {/* Typing Area */}
            <div className="flex-1 overflow-y-auto p-8 flex flex-col items-center pt-16 relative gap-8">
              
              {/* Decorative background elements */}
              <div className="absolute top-[-100px] left-[-100px] w-96 h-96 bg-blue-100 rounded-full blur-3xl opacity-50 pointer-events-none"></div>
              <div className="absolute bottom-[-100px] right-[-100px] w-96 h-96 bg-indigo-100 rounded-full blur-3xl opacity-50 pointer-events-none"></div>

              {sentence ? (
                <div className="w-full max-w-4xl z-10 relative">
                  <SentenceTrainer 
                    sentenceData={sentence} 
                    onComplete={handleComplete} 
                    totalSentences={sentences.length}
                    currentSentenceIndex={currentSentenceIndex}
                    onNavigate={setCurrentSentenceIndex}
                  />
                </div>
              ) : (
                <div className="text-center text-gray-400 mt-20 p-8 border-2 border-dashed border-gray-200 rounded-2xl w-full max-w-lg z-10 bg-white/50 backdrop-blur">
                  <div className="text-4xl mb-4">🚧</div>
                  <h3 className="text-lg font-bold text-gray-600 mb-2">未找到试题数据</h3>
                  <p className="text-sm">该模块暂时没有填入题目，请前往其他模块进行练习。</p>
                </div>
              )}

              {/* 完整骨架结构展示 */}
              {sentences.length > 0 && (
                <div className="bg-white/90 backdrop-blur-md rounded-2xl shadow-sm border border-gray-100 p-8 w-full max-w-4xl z-10 mb-12">
                  <h3 className="text-lg font-bold text-gray-800 mb-6 flex items-center gap-2">
                    <span className="text-indigo-500">🗺️</span> 骨架全貌导览 (Structural Overview)
                  </h3>
                  <div className="space-y-3">
                    {sentences.map((s, idx) => {
                      const pTitle = getParagraphTitle(s.id);
                      return (
                        <React.Fragment key={s.id}>
                          {pTitle && (
                            <div className="col-span-full mt-6 mb-2 flex items-center gap-2">
                              <span className="bg-indigo-100 text-indigo-700 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">{pTitle}</span>
                              <div className="h-[1px] bg-gray-200 flex-1"></div>
                            </div>
                          )}
                          <div 
                            onClick={() => setCurrentSentenceIndex(idx)}
                            className={`p-4 rounded-xl text-[15px] border-l-4 transition-all cursor-pointer hover:shadow-md ${
                              idx === currentSentenceIndex 
                                ? 'bg-blue-50 border-blue-500 text-blue-900 font-semibold shadow-sm scale-[1.01] -ml-2 hover:bg-blue-100' 
                                : idx < currentSentenceIndex 
                                  ? 'bg-gray-50 border-green-400 text-gray-500 hover:bg-gray-100' 
                                  : 'bg-transparent border-gray-200 text-gray-400 hover:bg-gray-50'
                            }`}
                          >
                            <div className="flex items-start gap-2">
                              <span className="font-mono opacity-50 w-6 shrink-0">{idx + 1}.</span> 
                              <span>
                                {s.chinese.split(/(\[.*?\])/).map((segment, i) => {
                                    if (segment.startsWith('[') && segment.endsWith(']')) {
                                        return <span key={i} className="text-blue-600 font-medium">{segment}</span>;
                                    }
                                    return segment;
                                })}
                              </span>
                            </div>
                          </div>
                        </React.Fragment>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
            
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
