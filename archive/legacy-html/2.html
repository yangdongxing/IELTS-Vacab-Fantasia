<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Writing Task 2 核心词伙练习</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f6f8fb 0%, #e5ebf4 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(255, 255, 255, 0.4);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent-primary: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --error: #ef4444;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
            --shadow-glass: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
                --card-bg: rgba(30, 41, 59, 0.75);
                --card-border: rgba(255, 255, 255, 0.1);
                --text-primary: #f8fafc;
                --text-secondary: #94a3b8;
                --accent-primary: #60a5fa;
                --accent-hover: #93c5fd;
                --success: #34d399;
                --error: #f87171;
                --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding: 2rem 1rem;
            transition: all 0.3s ease;
        }

        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            box-shadow: var(--shadow-glass);
            padding: 2.5rem;
            width: 100%;
            max-width: 800px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-align: center;
            background: linear-gradient(to right, #3b82f6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            font-size: 1rem;
        }

        /* Views */
        .view {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .view.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            margin-bottom: 2rem;
            width: 100%;
            max-width: 800px;
            font-size: 0.9rem;
            box-shadow: var(--shadow-sm);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
        }

        .stat-value {
            color: var(--accent-primary);
            font-weight: 700;
        }

        .stat-badge {
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent-primary);
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Categories Grid */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .category-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .category-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--accent-primary);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }

        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
            border-color: var(--accent-primary);
        }

        .category-card:hover::before {
            transform: scaleX(1);
        }

        .category-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .category-count {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        
        .global-actions {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            justify-content: center;
        }

        /* Buttons */
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
            box-shadow: 0 4px 14px 0 rgba(59, 130, 246, 0.39);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.23);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--text-secondary);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: rgba(100, 116, 139, 0.1);
        }

        /* Practice Area */
        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(100, 116, 139, 0.2);
            border-radius: 10px;
            margin-bottom: 2rem;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--accent-primary);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .practice-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .question-counter {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .score-display {
            display: flex;
            gap: 1rem;
            font-size: 0.9rem;
            font-weight: 600;
        }
        
        .score-display .correct { color: var(--success); }
        .score-display .wrong { color: var(--error); }

        .question-card {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .chinese-text {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .hint-text {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            transition: all 0.3s ease;
        }

        .hint-text.hint-active {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--accent-primary);
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
            animation: hintPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            letter-spacing: 0.5px;
            padding: 0.5rem 1rem;
            background: rgba(59, 130, 246, 0.08);
            border-radius: 12px;
            display: inline-block;
        }

        @keyframes hintPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .input-group {
            position: relative;
            width: 100%;
        }

        .answer-input {
            width: 100%;
            padding: 1.2rem 1.5rem;
            font-size: 1.25rem;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--card-border);
            border-radius: 16px;
            color: var(--text-primary);
            font-family: inherit;
            transition: all 0.3s ease;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
            text-align: center;
        }

        .answer-input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .feedback-area {
            margin-top: 1.5rem;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .feedback-msg {
            font-size: 1.1rem;
            font-weight: 600;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        .feedback-msg.correct {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .feedback-msg.wrong {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        /* Diff Styling */
        .diff-user, .diff-correct {
            font-family: 'Menlo', 'Consolas', 'Courier New', monospace;
            font-size: 1.3rem;
            font-weight: 600;
            word-break: break-all;
            line-height: 1.5;
            letter-spacing: 1px;
        }
        .diff-user {
            color: var(--text-secondary);
            margin-top: 0.8rem;
        }
        .diff-user .diff-same { 
            /* text-decoration: line-through;  */
            opacity: 0.6; 
        }
        .diff-user .diff-remove { 
            background-color: var(--error);
            color: white;
            border-radius: 3px;
            padding: 0 4px;
            text-decoration: line-through;
        }
        
        .diff-correct {
            margin-top: 0.5rem;
        }
        .diff-correct .diff-same { 
            color: var(--success); 
        }
        .diff-correct .diff-add {
            background-color: var(--success);
            color: white;
            border-radius: 3px;
            padding: 0 4px;
        }

        .correct-answer-reveal {
            font-weight: 700;
            font-size: 1.3rem;
            margin-top: 0.5rem;
            letter-spacing: 0.5px;
        }

        .action-row {
            display: flex;
            justify-content: space-between;
            margin-top: 2rem;
        }

        /* Animations */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .pop { animation: pop 0.3s ease-out; }

        /* Results View */
        .results-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .final-score {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--accent-primary);
            margin: 1rem 0;
            line-height: 1;
        }

        .mistakes-list {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }
        
        .mistakes-list::-webkit-scrollbar {
            width: 6px;
        }
        
        .mistakes-list::-webkit-scrollbar-thumb {
            background: var(--card-border);
            border-radius: 10px;
        }

        .mistake-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.2rem;
        }

        .mistake-zh {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .mistake-en {
            color: var(--success);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.3rem;
        }

        .mistake-user {
            color: var(--error);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: line-through;
        }

        .results-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2.5rem;
        }

        /* Confetti */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            opacity: 0;
        }
    </style>
</head>
<body>

    <!-- Stats Bar (Always visible on Home) -->

    <!-- View 2: Practice Interface -->

            <div class="category-badge" id="currentCategory" style="padding: 0.3rem 0.8rem; border-radius: 20px; background: rgba(59, 130, 246, 0.1); color: var(--accent-primary); font-size: 0.85rem; font-weight: 600; white-space: nowrap;">📂 全部词伙</div>
            <div class="score-display">
                <span class="correct">✓ <span id="runCorrect">0</span></span>
                <span class="wrong">✗ <span id="runWrong">0</span></span>

        </div>
        
        <div class="progress-container">

        </div>

        <div class="question-card">

        <div class="input-group">

        <div class="feedback-area" id="feedbackArea">

        <div class="action-row">

        </div>
    </div>

    <!-- View 3: Results -->
    <div class="glass-panel view" id="viewResults">
        <div class="results-header">
            <h2>练习完成！</h2>
            <div class="final-score" id="resultScore">100%</div>

        </div>

        <div id="mistakesSection" style="display: none;">
            <h3 style="margin-top: 2rem; border-bottom: 1px solid var(--card-border); padding-bottom: 0.5rem;">本次错题清单</h3>
            <div class="mistakes-list" id="CurrentMistakesList">
                <!-- Mistakes injected here -->
            </div>
        </div>

        <div class="results-actions">

            <button class="btn btn-primary" id="btnRetryWrong" style="display: none;">复习本次错题</button>
        </div>
    </div>

        // Local Storage Sync keys
        const STORE_KEY = 'ielts_vocab_stats';
        const MISTAKES_KEY = 'ielts_vocab_mistakes';

        function loadStats() {
            try {
                const data = JSON.parse(localStorage.getItem(STORE_KEY)) || {
                    history: {},
                    totalQuestions: 0,
                    correctAnswers: 0,
                    streak: 0,
                    lastPracticeDate: null
                };
                return data;
            } catch (e) {
                return { history: {}, totalQuestions: 0, correctAnswers: 0, streak: 0, lastPracticeDate: null };
            }
        }

        function saveStats(stats) {
            localStorage.setItem(STORE_KEY, JSON.stringify(stats));
        }

        function loadGlobalMistakes() {
            try {
                return JSON.parse(localStorage.getItem(MISTAKES_KEY)) || [];
            } catch (e) {
                return [];
            }
        }

        function saveGlobalMistakes(mistakes) {
            // deduplicate
            const unique = [];
            const seen = new Set();
            for (let m of mistakes) {
                if (!seen.has(m.zh)) {
                    seen.add(m.zh);
                    unique.push(m);
                }
            }
            localStorage.setItem(MISTAKES_KEY, JSON.stringify(unique));
        }

        function removeGlobalMistake(zh) {
            let mlist = loadGlobalMistakes();
            mlist = mlist.filter(m => m.zh !== zh);
            saveGlobalMistakes(mlist);
            updateHomeStats();
        }

        function updateHomeStats() {
            const stats = loadStats();
            const todayStr = new Date().toISOString().split('T')[0];
            const todayCount = stats.history[todayStr] || 0;
            
            document.getElementById('todayCount').innerText = todayCount;
            
            const acc = stats.totalQuestions > 0 
                ? Math.round((stats.correctAnswers / stats.totalQuestions) * 100) 
                : 0;
            document.getElementById('totalAccuracy').innerText = acc + '%';
            
            // Calc Streak
            let streak = stats.streak || 0;
            if (stats.lastPracticeDate) {
                const lastDate = new Date(stats.lastPracticeDate);
                const today = new Date();
                const diffTime = Math.abs(today - lastDate);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
                if (diffDays > 1 && todayStr !== stats.lastPracticeDate) {
                    streak = 0; // streak broken
                }
            }
            document.getElementById('streakBadge').innerText = `🔥 连续 ${streak} 天`;

            // Update Mistakes count
            const mistakes = loadGlobalMistakes();
            document.getElementById('mistakeBookCount').innerText = mistakes.length;
            
            if (mistakes.length === 0) {
                document.getElementById('btnPracticeMistakes').style.opacity = '0.5';
                document.getElementById('btnPracticeMistakes').style.cursor = 'not-allowed';
            } else {
                document.getElementById('btnPracticeMistakes').style.opacity = '1';
                document.getElementById('btnPracticeMistakes').style.cursor = 'pointer';
            }
        }

        function logPractice(isCorrect) {
            const stats = loadStats();
            const todayStr = new Date().toISOString().split('T')[0];
            
            if (!stats.history[todayStr]) {
                stats.history[todayStr] = 0;
                // new day, increase streak if last practice was yesterday
                if (stats.lastPracticeDate) {
                    const lastD = new Date(stats.lastPracticeDate);
                    const todayD = new Date(todayStr);
                    const diffTime = Math.abs(todayD - lastD);
                    const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24)); 
                    if (diffDays === 1) {
                        stats.streak = (stats.streak || 0) + 1;
                    } else if (diffDays > 1) {
                        stats.streak = 1;
                    }
                } else {
                    stats.streak = 1;
                }
                stats.lastPracticeDate = todayStr;
            }
            
            stats.history[todayStr]++;
            stats.totalQuestions++;
            if (isCorrect) stats.correctAnswers++;
            
            saveStats(stats);
        }

        // --- Core Logic ---
        function shuffle(array) {
            let currentIndex = array.length,  randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function startPractice(dataset, categoryName) {
            if (dataset.length === 0) return;
            currentQueue = shuffle([...dataset]);
            currentIndex = 0;
            correctCount = 0;
            wrongCount = 0;
            currentMistakes = [];
            isWaitingForNext = false;
            currentCategoryName = categoryName || '全部词伙';
            document.getElementById('currentCategory').innerText = '📂 ' + currentCategoryName;
            
            switchView('viewPractice');
            loadQuestion();
        }

        function loadQuestion() {
            isWaitingForNext = false;
            const q = currentQueue[currentIndex];
            
            // Update UI
            document.getElementById('questionCounter').innerText = `进度: ${currentIndex + 1} / ${currentQueue.length}`;
            document.getElementById('runCorrect').innerText = correctCount;
            document.getElementById('runWrong').innerText = wrongCount;
            document.getElementById('currentChinese').innerText = q.zh;
            
            const progressPct = ((currentIndex) / currentQueue.length) * 100;
            document.getElementById('progressBar').style.width = `${progressPct}%`;
            
            const hintEl = document.getElementById('currentHint');
            hintEl.innerText = "Type the English phrase and press Enter";
            hintEl.classList.remove('hint-active');

            inputField.value = '';
            inputField.disabled = false;
            inputField.focus();
            
            feedbackArea.innerHTML = '';
            btnNext.style.visibility = 'hidden';
        }

        function checkAnswer() {
            if (isWaitingForNext) {
                goToNext();
                return;
            }

            const ans = inputField.value.trim().toLowerCase();
            if (ans === '') return; // don't submit empty

            const q = currentQueue[currentIndex];
            // Normalize: remove extra spaces, punctuation
            const normalize = (str) => str.toLowerCase().replace(/[^a-z0-9]/g, '');
            const isCorrect = normalize(ans) === normalize(q.en);

            inputField.disabled = true;
            isWaitingForNext = true;
            btnNext.style.visibility = 'visible';
            btnNext.focus();

            logPractice(isCorrect);

            if (isCorrect) {
                correctCount++;
                document.getElementById('runCorrect').innerText = correctCount;
                
                // If it was in global mistakes, we might remove it if they got it right
                // Optional: removeGlobalMistake(q.zh);
                removeGlobalMistake(q.zh); 
                
                feedbackArea.innerHTML = `
                    <div class="feedback-msg correct pop">
                        <div>✨ 完全正确！</div>
                        <div class="correct-answer-reveal">${q.en}</div>
                    </div>
                `;
            } else {
                wrongCount++;
                document.getElementById('runWrong').innerText = wrongCount;
                currentMistakes.push({ ...q, user_ans: ans });
                
                // Add to global mistakes
                const globalM = loadGlobalMistakes();
                globalM.push(q);
                saveGlobalMistakes(globalM);

                const card = document.querySelector('.glass-panel.active');
                card.classList.remove('shake');
                void card.offsetWidth; // trigger reflow
                card.classList.add('shake');

                const diffs = generateDiffHTML(ans, q.en);

                feedbackArea.innerHTML = `
                    <div class="feedback-msg wrong pop">
                        <div>❌ 需要订正</div>
                        <div class="diff-user">${diffs.userDiff}</div>
                        <div class="diff-correct">${diffs.correctDiff}</div>
                    </div>
                `;
            }
        }

        function escapeHTML(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function generateDiffHTML(userStr, correctStr) {
            const m = userStr.length;
            const n = correctStr.length;
            const dp = Array(m + 1).fill(null).map(() => Array(n + 1).fill(0));
            
            for (let i = 1; i <= m; i++) {
                for (let j = 1; j <= n; j++) {
                    if (userStr[i - 1] === correctStr[j - 1]) {
                        dp[i][j] = dp[i - 1][j - 1] + 1;
                    } else {
                        dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
                    }
                }
            }
            
            let i = m, j = n;
            const userOps = [];
            const correctOps = [];
            
            while (i > 0 || j > 0) {
                if (i > 0 && j > 0 && userStr[i - 1] === correctStr[j - 1]) {
                    userOps.push({ type: 'same', char: userStr[i - 1] });
                    correctOps.push({ type: 'same', char: correctStr[j - 1] });
                    i--; j--;
                } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
                    correctOps.push({ type: 'add', char: correctStr[j - 1] });
                    j--;
                } else if (i > 0 && (j === 0 || dp[i][j - 1] < dp[i - 1][j])) {
                    userOps.push({ type: 'remove', char: userStr[i - 1] });
                    i--;
                }
            }
            
            userOps.reverse();
            correctOps.reverse();

            function renderOps(ops) {
                if (ops.length === 0) return '';
                let result = '';
                let type = ops[0].type;
                let text = ops[0].char;
                for (let k = 1; k < ops.length; k++) {
                    if (ops[k].type === type) {
                        text += ops[k].char;
                    } else {
                        result += `<span class="diff-${type}">${escapeHTML(text)}</span>`;
                        type = ops[k].type;
                        text = ops[k].char;
                    }
                }
                result += `<span class="diff-${type}">${escapeHTML(text)}</span>`;
                return result;
            }

            return {
                userDiff: renderOps(userOps),
                correctDiff: renderOps(correctOps)
            };
        }

        function goToNext() {
            currentIndex++;
            if (currentIndex >= currentQueue.length) {
                showResults();
            } else {
                loadQuestion();
            }
        }

        function showHint() {
            if (isWaitingForNext || currentQueue.length === 0) return;
            const q = currentQueue[currentIndex];
            const hintEl = document.getElementById('currentHint');
            hintEl.innerText = `💡 ${q.en}`;
            hintEl.classList.add('hint-active');
            
            setTimeout(() => {
                if (!isWaitingForNext) {
                    hintEl.innerText = "Type the English phrase and press Enter";
                    hintEl.classList.remove('hint-active');
                }
            }, 5000);
            
            inputField.focus();
        }

        function showResults() {
            document.getElementById('progressBar').style.width = '100%';
            
            const accuracy = Math.round((correctCount / currentQueue.length) * 100);
            document.getElementById('resultScore').innerText = `${accuracy}%`;
            
            const msgEl = document.getElementById('resultMsg');
            if (accuracy >= 90) msgEl.innerText = "太棒了！雅思写作一定能拿高分！🎉";
            else if (accuracy >= 70) msgEl.innerText = "还不错，再接再厉！👍";
            else msgEl.innerText = "需要多加练习哦，熟能生巧！💪";

            const mstkSection = document.getElementById('mistakesSection');
            const mstkList = document.getElementById('CurrentMistakesList');
            const btnRetry = document.getElementById('btnRetryWrong');

            if (currentMistakes.length > 0) {
                mstkSection.style.display = 'block';
                btnRetry.style.display = 'inline-flex';
                
                mstkList.innerHTML = currentMistakes.map(m => `
                    <div class="mistake-item">
                        <div class="mistake-zh">${m.zh}</div>
                        <div class="mistake-en">✓ ${m.en}</div>
                        <div class="mistake-user">✗ ${m.user_ans}</div>
                    </div>
                `).join('');
            } else {
                mstkSection.style.display = 'none';
                btnRetry.style.display = 'none';
            }

            switchView('viewResults');
        }

        // --- Event Listeners ---
        document.getElementById('btnPracticeAll').addEventListener('click', () => startPractice(vocabData, '全部词伙'));
        
        document.getElementById('btnPracticeMistakes').addEventListener('click', () => {
            const m = loadGlobalMistakes();
            if (m.length > 0) startPractice(m, '错题本');
        });

        document.getElementById('btnRetryWrong').addEventListener('click', () => {
            // retry current session's wrong ones only by mapping to original format
            const retryData = currentMistakes.map(m => ({ category: m.category, zh: m.zh, en: m.en }));
            startPractice(retryData, '复习错题');
        });

        document.getElementById('btnBackToHome').addEventListener('click', () => switchView('viewHome'));
        document.getElementById('btnExitPractice').addEventListener('click', () => switchView('viewHome'));
        btnHint.addEventListener('click', showHint);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (document.getElementById('viewPractice').classList.contains('active')) {
                    if (isWaitingForNext) {
                        goToNext();
                    } else if (document.activeElement === inputField) {
                        checkAnswer();
                    }
                }
            } else if (e.key === 'Escape') {
                if (document.getElementById('viewPractice').classList.contains('active')) {
                    e.preventDefault();
                    showHint();
                }
            } else if (e.key === '?' && document.activeElement === inputField) {
                if (document.getElementById('viewPractice').classList.contains('active')) {
                    e.preventDefault();
                    showHint();
                }
            }
        });

        btnNext.addEventListener('click', goToNext);

        // Run
        initApp();
    </script>
</body>
</html>
