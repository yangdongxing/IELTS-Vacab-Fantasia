<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IELTS 骨架实例文章默写列表 Mini</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --panel: #ffffff;
      --line: #e5e7eb;
      --text: #172033;
      --muted: #697386;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --green: #059669;
      --green-soft: #ecfdf5;
      --red: #dc2626;
      --red-soft: #fef2f2;
      --amber: #d97706;
      --amber-soft: #fffbeb;
      --emerald-soft: #ecfdf5;
      --emerald-line: #a7f3d0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", Arial, sans-serif;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 56px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      margin: 0 -16px 20px;
      padding: 16px;
      background: rgba(246, 247, 251, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(229, 231, 235, 0.8);
    }

    .topbar-inner {
      width: min(1180px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .stat {
      min-width: 92px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      text-align: center;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    .stat strong {
      display: block;
      font-size: 20px;
      line-height: 1.1;
    }

    .stat span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .filters {
      width: min(1180px, 100%);
      margin: 14px auto 0;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .filter-btn {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }

    .filter-btn.active {
      border-color: var(--blue);
      background: var(--blue-soft);
      color: var(--blue);
    }

    .tools {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 18px 0 22px;
    }

    .tool-btn {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      padding: 9px 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .tool-btn.primary {
      border-color: var(--blue);
      background: var(--blue);
      color: white;
    }

    .category-section {
      margin-bottom: 28px;
      scroll-margin-top: 150px;
    }

    .category-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 12px;
      font-size: 18px;
    }

    .category-count {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .article-list {
      display: grid;
      gap: 12px;
    }

    .paragraph-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0 2px;
      color: var(--blue);
      font-size: 14px;
      font-weight: 900;
    }

    .paragraph-divider::after {
      content: '';
      height: 1px;
      flex: 1;
      background: var(--line);
    }

    .paragraph-divider span {
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid rgba(37, 99, 235, 0.16);
      background: var(--blue-soft);
    }

    .article-row {
      display: grid;
      grid-template-columns: 44px minmax(260px, 0.9fr) minmax(320px, 1.1fr) auto auto;
      gap: 12px;
      align-items: start;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    .article-row.correct {
      border-color: rgba(5, 150, 105, 0.35);
      background: var(--green-soft);
    }

    .article-row.error {
      border-color: rgba(220, 38, 38, 0.35);
      background: var(--red-soft);
    }

    .index-pill {
      width: 36px;
      min-height: 36px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      color: var(--muted);
      font-weight: 900;
      border: 1px solid var(--line);
    }

    .zh-cell {
      display: grid;
      gap: 8px;
    }

    .zh {
      min-height: 46px;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--emerald-soft);
      border: 1px solid var(--emerald-line);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.5;
      cursor: pointer;
    }

    .zh mark {
      color: #047857;
      background: transparent;
      font-weight: 900;
    }

    .skeleton {
      display: none;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(37, 99, 235, 0.16);
      background: var(--blue-soft);
      color: var(--blue);
      font: 750 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    .article-row.show-skeleton .skeleton {
      display: block;
    }

    .mini-badge {
      display: inline-flex;
      width: max-content;
      margin-right: 8px;
      padding: 3px 7px;
      border-radius: 999px;
      background: #dbeafe;
      color: #1d4ed8;
      font: 800 12px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", Arial, sans-serif;
      vertical-align: 1px;
    }

    textarea {
      width: 100%;
      min-height: 92px;
      resize: vertical;
      border: 2px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      font: 650 15px/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      color: var(--text);
      outline: none;
      background: #fff;
    }

    .input-cell {
      display: grid;
      gap: 8px;
    }

    textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .article-row.correct textarea {
      border-color: var(--green);
      color: var(--green);
      background: #fff;
    }

    .article-row.error textarea {
      border-color: var(--red);
      color: var(--red);
      background: #fff;
    }

    .play-btn {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--blue);
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
    }

    .play-btn:hover {
      border-color: var(--blue);
      background: var(--blue-soft);
    }

    .status {
      width: 92px;
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      color: var(--muted);
      background: #f8fafc;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .article-row.correct .status {
      color: var(--green);
      background: rgba(5, 150, 105, 0.1);
    }

    .article-row.error .status {
      color: var(--red);
      background: rgba(220, 38, 38, 0.1);
    }

    .answer {
      display: none;
      padding: 9px 11px;
      border-radius: 8px;
      background: var(--amber-soft);
      color: var(--amber);
      font: 750 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    .article-row.show-answer .answer {
      display: block;
    }

    .hidden { display: none; }

    @media (max-width: 920px) {
      .topbar-inner { grid-template-columns: 1fr; }
      .stats { justify-content: stretch; }
      .stat { flex: 1; }
      .article-row { grid-template-columns: 1fr; }
      .index-pill, .play-btn, .status { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div>
        <h1>IELTS 骨架实例文章默写列表 Mini</h1>
        <p class="subtitle">保留全部实例句；双边讨论类和报告类的可替换句显示压缩骨架，并与当前英文答案保持同构。输入校验规则不变。</p>
      </div>
      <div class="stats">
        <div class="stat"><strong id="totalCount">0</strong><span>总数</span></div>
        <div class="stat"><strong id="correctCount">0</strong><span>正确</span></div>
        <div class="stat"><strong id="errorCount">0</strong><span>需修正</span></div>
      </div>
    </div>
    <div class="filters" id="filters"></div>
  </div>

  <main class="shell">
    <div class="tools">
      <button class="tool-btn primary" id="focusFirst">从第一句开始</button>
      <button class="tool-btn" id="showAnswers">显示答案</button>
      <button class="tool-btn" id="hideAnswers">隐藏答案</button>
      <button class="tool-btn" id="showOnlyErrors">只看需修正</button>
      <button class="tool-btn" id="showAll">显示全部</button>
    </div>
    <div id="app"></div>
  </main>

  <script>

            "english": "Consequently, there is a controversy advocating for governments should make household waste recycling a legal requirement.",
            "skeleton": "Consequently, there is a controversy advocating for [题目极端建议]."

      filters.innerHTML = categories.map(cat => '<button class="filter-btn" data-category="' + escapeAttr(cat) + '">' + escapeHTML(cat) + '</button>').join('');
      filters.addEventListener('click', event => {
        const btn = event.target.closest('.filter-btn');
        if (!btn) return;
        activeCategory = btn.dataset.category;
        document.querySelectorAll('.filter-btn').forEach(item => item.classList.toggle('active', item === btn));
        applyVisibility();
      });
      filters.querySelector('.filter-btn').classList.add('active');
    }

    function renderList() {
      const grouped = new Map();
      examples.forEach(item => {
        if (!grouped.has(item.category)) grouped.set(item.category, []);
        grouped.get(item.category).push(item);
      });

      app.innerHTML = [...grouped.entries()].map(([category, items]) => {
        const rows = items.map(item => {
          const paragraphTitle = paragraphTitles[item.categoryKey] && paragraphTitles[item.categoryKey][item.number];
          const divider = paragraphTitle
            ? '<div class="paragraph-divider"><span>' + escapeHTML(paragraphTitle) + '</span></div>'
            : '';
          return divider + '<div class="article-row" data-category="' + escapeAttr(item.category) + '">' +
            '<div class="index-pill">' + item.number + '</div>' +
            '<div class="zh-cell">' +
              '<div class="zh" title="点击显示/隐藏英文骨架">' + highlightChinese(item.chinese) + '</div>' +
              '<div class="skeleton">' + (item.miniReplacement ? '<span class="mini-badge">压缩骨架</span>' : '') + escapeHTML(item.skeleton) + '</div>' +
            '</div>' +
            '<div class="input-cell">' +
              '<textarea autocomplete="off" spellcheck="false" data-answer="' + escapeAttr(item.english) + '" placeholder="Type the full English sentence"></textarea>' +
              '<div class="answer">' + escapeHTML(item.english) + '</div>' +
            '</div>' +
            '<button class="play-btn" type="button" data-sentence="' + escapeAttr(item.english) + '" title="播放英文句子" aria-label="播放英文句子">▶</button>' +
            '<div class="status">待输入</div>' +
          '</div>';
        }).join('');
        return '<section class="category-section" data-category="' + escapeAttr(category) + '">' +
          '<h2 class="category-title">' + escapeHTML(category) + '<span class="category-count">' + items.length + ' 句</span></h2>' +
          '<div class="article-list">' + rows + '</div>' +
        '</section>';
      }).join('');

      document.querySelectorAll('textarea').forEach(textarea => {
        textarea.addEventListener('input', () => {
          updateRow(textarea.closest('.article-row'));
          if (onlyErrors) applyVisibility();
        });
        textarea.addEventListener('keydown', event => {
          if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            focusNextTextarea(textarea);
          }
          if (event.key === 'Escape') {
            textarea.closest('.article-row').classList.toggle('show-answer');
          }
        });
      });
      document.querySelectorAll('.play-btn').forEach(button => {
        button.addEventListener('click', () => speakSentence(button.dataset.sentence));
      });
      document.querySelectorAll('.zh').forEach(block => {
        block.addEventListener('click', () => block.closest('.article-row').classList.toggle('show-skeleton'));
      });
      updateStats();
    }

    function highlightChinese(value) {
      return escapeHTML(value).replace(/【(.*?)】/g, '<mark>【$1】</mark>');
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    }

    function escapeAttr(value) {
      return escapeHTML(value);
    }

    document.getElementById('focusFirst').addEventListener('click', () => {
      const first = document.querySelector('.article-row:not(.hidden) textarea');
      if (first) first.focus();
    });

    document.getElementById('showAnswers').addEventListener('click', () => {
      document.querySelectorAll('.article-row').forEach(row => row.classList.add('show-answer'));
    });

    document.getElementById('hideAnswers').addEventListener('click', () => {
      document.querySelectorAll('.article-row').forEach(row => row.classList.remove('show-answer'));
    });

    document.getElementById('showOnlyErrors').addEventListener('click', () => {
      onlyErrors = true;
      applyVisibility();
    });

    document.getElementById('showAll').addEventListener('click', () => {
      onlyErrors = false;
      applyVisibility();
    });

    renderFilters();
    renderList();
  </script>
</body>
</html>
