<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IELTS 核心词伙拼写列表</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --panel: #ffffff;
      --line: #e5e7eb;
      --text: #172033;
      --muted: #697386;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --green: #059669;
      --green-soft: #ecfdf5;
      --red: #dc2626;
      --red-soft: #fef2f2;
      --amber: #d97706;
      --amber-soft: #fffbeb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", Arial, sans-serif;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 56px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      margin: 0 -16px 20px;
      padding: 16px;
      background: rgba(246, 247, 251, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(229, 231, 235, 0.8);
    }

    .topbar-inner {
      width: min(1180px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .stat {
      min-width: 92px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      text-align: center;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    .stat strong {
      display: block;
      font-size: 20px;
      line-height: 1.1;
    }

    .stat span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .filters {
      width: min(1180px, 100%);
      margin: 14px auto 0;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .filter-btn {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }

    .filter-btn.active {
      border-color: var(--blue);
      background: var(--blue-soft);
      color: var(--blue);
    }

    .category-section {
      margin-bottom: 28px;
      scroll-margin-top: 150px;
    }

    .category-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 12px;
      font-size: 18px;
    }

    .category-count {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .phrase-list {
      display: grid;
      gap: 10px;
    }

    .phrase-row {
      display: grid;
      grid-template-columns: minmax(180px, 0.85fr) minmax(240px, 1.15fr) auto auto;
      gap: 12px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    .phrase-row.correct {
      border-color: rgba(5, 150, 105, 0.35);
      background: var(--green-soft);
    }

    .phrase-row.error {
      border-color: rgba(220, 38, 38, 0.35);
      background: var(--red-soft);
    }

    .zh {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.4;
    }

    input {
      width: 100%;
      min-height: 42px;
      border: 2px solid var(--line);
      border-radius: 8px;
      padding: 8px 11px;
      font: 600 16px/1.3 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      color: var(--text);
      outline: none;
      background: #fff;
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .phrase-row.correct input {
      border-color: var(--green);
      color: var(--green);
      background: #fff;
    }

    .phrase-row.error input {
      border-color: var(--red);
      color: var(--red);
      background: #fff;
    }

    .play-btn {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--blue);
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
    }

    .play-btn:hover {
      border-color: var(--blue);
      background: var(--blue-soft);
    }

    .status {
      width: 92px;
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      color: var(--muted);
      background: #f8fafc;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .phrase-row.correct .status {
      color: var(--green);
      background: rgba(5, 150, 105, 0.1);
    }

    .phrase-row.error .status {
      color: var(--red);
      background: rgba(220, 38, 38, 0.1);
    }

    .answer {
      display: none;
      grid-column: 2 / 5;
      margin-top: -4px;
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--amber-soft);
      color: var(--amber);
      font: 700 14px/1.4 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    .phrase-row.show-answer .answer {
      display: block;
    }

    .tools {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 18px 0 22px;
    }

    .tool-btn {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      padding: 9px 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .tool-btn.primary {
      border-color: var(--blue);
      background: var(--blue);
      color: white;
    }

    .hidden { display: none; }

    @media (max-width: 760px) {
      .topbar-inner { grid-template-columns: 1fr; }
      .stats { justify-content: stretch; }
      .stat { flex: 1; }
      .phrase-row { grid-template-columns: 1fr; }
      .play-btn { width: 100%; }
      .status { width: 100%; }
      .answer { grid-column: auto; }
    }
  </style>
</head>

      </div>

        <div class="stat"><strong id="errorCount">0</strong><span>需修正</span></div>
      </div>
    </div>
    <div class="filters" id="filters"></div>
  </div>

      <button class="tool-btn" id="showAll">显示全部</button>
    </div>
    <div id="app"></div>

    const app = document.getElementById('app');
    const filters = document.getElementById('filters');
    const totalCount = document.getElementById('totalCount');
    const correctCount = document.getElementById('correctCount');
    const errorCount = document.getElementById('errorCount');
    let activeCategory = '全部';
    let onlyErrors = false;

    const clean = value => value.toLowerCase().replace(/[^a-z0-9]/g, '');

    function getState(row) {
      const input = row.querySelector('input');
      const user = clean(input.value);
      const answer = clean(input.dataset.answer);
      if (!user) return 'empty';
      if (user === answer) return 'correct';
      if (answer.startsWith(user)) return 'partial';
      return 'error';
    }

    function updateRow(row) {
      const state = getState(row);
      const status = row.querySelector('.status');
      row.classList.toggle('correct', state === 'correct');
      row.classList.toggle('error', state === 'error');
      status.textContent = state === 'correct' ? '正确' : state === 'error' ? '错误' : state === 'partial' ? '继续' : '待输入';
      updateStats();
    }

    function updateStats() {
      const rows = [...document.querySelectorAll('.phrase-row')];
      totalCount.textContent = rows.length;
      correctCount.textContent = rows.filter(row => getState(row) === 'correct').length;
      errorCount.textContent = rows.filter(row => getState(row) === 'error').length;
    }

    function speakPhrase(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    }

    function focusNextInput(currentInput) {
      const inputs = [...document.querySelectorAll('.phrase-row:not(.hidden) input')];
      const currentIndex = inputs.indexOf(currentInput);
      const nextInput = inputs[currentIndex + 1];
      if (nextInput) {
        nextInput.focus();
        nextInput.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
    }

    function applyVisibility() {
      document.querySelectorAll('.category-section').forEach(section => {
        const cat = section.dataset.category;
        const rows = [...section.querySelectorAll('.phrase-row')];
        let visibleRows = 0;
        rows.forEach(row => {
          const categoryMatch = activeCategory === '全部' || cat === activeCategory;
          const errorMatch = !onlyErrors || getState(row) === 'error';
          const visible = categoryMatch && errorMatch;
          row.classList.toggle('hidden', !visible);
          if (visible) visibleRows += 1;
        });
        section.classList.toggle('hidden', visibleRows === 0);
      });
    }

    function renderFilters() {
      const categories = ['全部', ...new Set(vocab.map(item => item.category))];
      filters.innerHTML = categories.map(cat => '<button class="filter-btn" data-category="' + cat + '">' + cat + '</button>').join('');
      filters.addEventListener('click', event => {
        const btn = event.target.closest('.filter-btn');
        if (!btn) return;
        activeCategory = btn.dataset.category;
        document.querySelectorAll('.filter-btn').forEach(item => item.classList.toggle('active', item === btn));
        applyVisibility();
      });
      filters.querySelector('.filter-btn').classList.add('active');
    }

    function renderList() {
      const grouped = new Map();
      vocab.forEach(item => {
        if (!grouped.has(item.category)) grouped.set(item.category, []);
        grouped.get(item.category).push(item);
      });

      app.innerHTML = [...grouped.entries()].map(([category, items]) => {
        const rows = items.map((item, index) => {
          const id = category + '-' + index;
          return '<div class="phrase-row" data-category="' + item.category + '">' +
            '<div class="zh">' + escapeHTML(item.zh) + '</div>' +
            '<input id="' + id + '" type="text" autocomplete="off" spellcheck="false" data-answer="' + escapeAttr(item.en) + '" placeholder="Type English phrase">' +
            '<button class="play-btn" type="button" data-phrase="' + escapeAttr(item.en) + '" title="播放英文短语" aria-label="播放英文短语">▶</button>' +
            '<div class="status">待输入</div>' +
            '<div class="answer">' + escapeHTML(item.en) + '</div>' +
          '</div>';
        }).join('');
        return '<section class="category-section" data-category="' + category + '">' +
          '<h2 class="category-title">' + category + '<span class="category-count">' + items.length + ' 个</span></h2>' +
          '<div class="phrase-list">' + rows + '</div>' +
        '</section>';
      }).join('');

      document.querySelectorAll('input').forEach(input => {
        input.addEventListener('input', () => {
          updateRow(input.closest('.phrase-row'));
          if (onlyErrors) applyVisibility();
        });
        input.addEventListener('keydown', event => {
          if (event.key === 'Enter') {
            event.preventDefault();
            focusNextInput(input);
          } else if (event.key === 'Escape') {
            event.preventDefault();
            speakPhrase(input.dataset.answer);
          }
        });
      });
      document.querySelectorAll('.play-btn').forEach(button => {
        button.addEventListener('click', () => speakPhrase(button.dataset.phrase));
      });
      updateStats();
    }

    function escapeHTML(value) {
      return value.replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    }

    function escapeAttr(value) {
      return escapeHTML(value);
    }

    document.getElementById('focusFirst').addEventListener('click', () => {
      const first = document.querySelector('.phrase-row:not(.hidden) input');
      if (first) first.focus();
    });

    document.getElementById('showAnswers').addEventListener('click', () => {
      document.querySelectorAll('.phrase-row').forEach(row => row.classList.add('show-answer'));
    });

    document.getElementById('hideAnswers').addEventListener('click', () => {
      document.querySelectorAll('.phrase-row').forEach(row => row.classList.remove('show-answer'));
    });

    document.getElementById('showOnlyErrors').addEventListener('click', () => {
      onlyErrors = true;
      applyVisibility();
    });

    document.getElementById('showAll').addEventListener('click', () => {
      onlyErrors = false;
      applyVisibility();
    });

    renderFilters();
    renderList();
  </script>
